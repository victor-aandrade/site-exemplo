<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Cadastre-se para participar das ações da ONG Fictícia."
    >

    <title>Cadastro | ONG Fictícia</title>

    <link rel="stylesheet" href="estilos/estyle.css">
</head>

<body>

    <header class="cabecalho">

        <div class="container-cabecalho">

            <h1>ONG Fictícia</h1>

            <button
                class="menu-hamburguer"
                id="menu-hamburguer"
                aria-label="Abrir menu"
                aria-expanded="false"
                aria-controls="menu-principal"
            >
                ☰
            </button>

        </div>


        <nav id="menu-principal" class="menu-principal">

            <ul>

                <li>
                    <a href="index.html">Início</a>
                </li>

                <li>
                    <a href="projetos.html">Projetos</a>
                </li>

                <li>
                    <a href="cadastro.html" class="ativo">Cadastro</a>
                </li>

            </ul>

        </nav>

    </header>


    <main class="pagina-formulario">

        <section class="introducao">

            <h2>Cadastre-se</h2>

            <p>
                Preencha o formulário abaixo para participar das
                atividades e projetos da ONG Fictícia.
            </p>

        </section>


        <form id="formulario-cadastro" novalidate>

            <fieldset>

                <legend>Dados pessoais</legend>


                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        required
                        minlength="3"
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@email.com"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="nascimento">
                        Data de nascimento
                    </label>

                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        inputmode="numeric"
                        pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                        title="Digite o CPF no formato 000.000.000-00"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        maxlength="15"
                        inputmode="numeric"
                        pattern="\(\d{2}\) \d{5}-\d{4}"
                        title="Digite o telefone no formato (00) 00000-0000"
                        required
                    >

                </div>

            </fieldset>


            <fieldset>

                <legend>Endereço</legend>


                <div class="campo">

                    <label for="endereco">
                        Endereço
                    </label>

                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        placeholder="Rua, avenida..."
                        required
                    >

                </div>


                <div class="campo">

                    <label for="numero">
                        Número
                    </label>

                    <input
                        type="text"
                        id="numero"
                        name="numero"
                        placeholder="Número"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="cidade">
                        Cidade
                    </label>

                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        placeholder="Digite sua cidade"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="cep">
                        CEP
                    </label>

                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="00000-000"
                        maxlength="9"
                        inputmode="numeric"
                        pattern="\d{5}-\d{3}"
                        title="Digite o CEP no formato 00000-000"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="estado">
                        Estado
                    </label>

                    <select
                        id="estado"
                        name="estado"
                        required
                    >

                        <option value="">
                            Selecione
                        </option>

                        <option value="SE">
                            Sergipe
                        </option>

                        <option value="BA">
                            Bahia
                        </option>

                        <option value="AL">
                            Alagoas
                        </option>

                        <option value="PE">
                            Pernambuco
                        </option>

                        <option value="SP">
                            São Paulo
                        </option>

                        <option value="RJ">
                            Rio de Janeiro
                        </option>

                        <option value="MG">
                            Minas Gerais
                        </option>

                        <option value="GO">
                            Goiás
                        </option>

                        <option value="DF">
                            Distrito Federal
                        </option>

                    </select>

                </div>

            </fieldset>


            <div class="campo-checkbox">

                <input
                    type="checkbox"
                    id="termos"
                    name="termos"
                    required
                >

                <label for="termos">
                    Concordo com o envio dos meus dados.
                </label>

            </div>


            <div
                id="mensagem"
                class="mensagem"
                role="alert"
                aria-live="polite"
            ></div>


            <button
                type="submit"
                class="botao"
            >
                Enviar cadastro
            </button>

        </form>


        <div class="acoes-pagina">

            <a
                href="index.html"
                class="botao botao-voltar"
            >
                Voltar para o início
            </a>

        </div>

    </main>


    <footer class="rodape">

        <p>
            &copy; 2026 ONG Fictícia. Todos os direitos reservados.
        </p>

    </footer>


    <script src="script/script.js"></script>

</body>
</html>
